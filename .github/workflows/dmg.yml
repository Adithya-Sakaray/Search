# Builds Search.dmg on a Mac runner. Run it by hand from the Actions tab,
# or with: gh workflow run dmg.yml -f branch=main
#
# The app is ad-hoc signed. macOS will refuse the first open until you
# right-click the app and choose Open. A notarised build needs a Developer
# ID certificate, which this workflow does not have.

name: Build DMG

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch or tag to build
        required: true
        default: main
        type: string
      publish_release:
        description: Attach the DMG to a new GitHub Release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build the disk image
        run: ./build.sh release dmg

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: Search-dmg-${{ github.run_number }}
          path: |
            build/Search.dmg
            build/Search.zip
          if-no-files-found: error

      - name: Publish a release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REF: ${{ inputs.branch }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="dmg-${VERSION}-${GITHUB_RUN_NUMBER}"
          NOTES="Built from \`${BUILD_REF}\` at \`${GITHUB_SHA}\`.

          The app is ad-hoc signed, so the first launch needs a right-click on Search → Open.
          Search.dmg is the installer. Search.zip is the same app, packed for the updater."
          gh release create "$TAG" build/Search.dmg build/Search.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Search ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "$NOTES" \
            --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
